[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "numpy",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"
exclude = ["^llm_sdk/", "^\\.venv/", "^typings/"]
